server:
  port: 8085

spring:
  application:
    name: function-catalog-service
  config:
    import: optional:file:.env[.properties],optional:file:../.env[.properties]
  datasource:
    url: jdbc:postgresql://localhost:5432/function_catalog_db
    username: postgres
    password: ${FUNCTION_CATALOG_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    prefer-ip-address: true

jwt:
  public-key: ${JWT_PUBLIC_KEY}
  issuer: ${JWT_ISSUER:?JWT_ISSUER is required}
  audience: ${JWT_AUDIENCE:?JWT_AUDIENCE is required}

app:
  cookie:
    secure: ${APP_COOKIE_SECURE:false}
    same-site: ${APP_COOKIE_SAME_SITE:Strict}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
  internal-auth:
    identity-service-key: ${INTERNAL_IDENTITY_KEY:?INTERNAL_IDENTITY_KEY is required}

security:
  introspection:
    base-url: ${IDENTITY_SERVICE_BASE_URL:http://localhost:8081}
    client-key: ${INTERNAL_FUNCTION_CATALOG_KEY:?INTERNAL_FUNCTION_CATALOG_KEY is required}

springdoc:
  swagger-ui:
    path: /swagger

azure:
  translator:
    endpoint: ${AZURE_TRANSLATOR_ENDPOINT:https://api.cognitive.microsofttranslator.com}
    key: ${AZURE_TRANSLATOR_KEY:}
    region: ${AZURE_TRANSLATOR_REGION:}
