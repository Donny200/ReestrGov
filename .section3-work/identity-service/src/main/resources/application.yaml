spring:
  application:
    name: identity-service

  config:
    import: optional:file:.env[.properties],optional:file:../.env[.properties]

  datasource:
    url: jdbc:postgresql://localhost:5432/adlita_project1
    username: postgres
    password: ${IDENTITY_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    baseline-on-migrate: true
    baseline-version: 0

springdoc:
  swagger-ui:
    path: /swagger

jwt:
  private-key: ${JWT_PRIVATE_KEY}
  public-key: ${JWT_PUBLIC_KEY}
  issuer: ${JWT_ISSUER:?JWT_ISSUER is required}
  audience: ${JWT_AUDIENCE:?JWT_AUDIENCE is required}
  expiration: ${JWT_ACCESS_EXPIRATION_MS:900000}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION_MS:604800000}

app:
  cookie:
    access-token-name: accessToken
    refresh-token-name: refreshToken
    refresh-token-path: /api/auth
    secure: ${APP_COOKIE_SECURE:false}
    same-site: ${APP_COOKIE_SAME_SITE:Strict}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
  internal-auth:
    gateway-key: ${INTERNAL_GATEWAY_KEY:?INTERNAL_GATEWAY_KEY is required}
    reference-service-key: ${INTERNAL_REFERENCE_KEY:?INTERNAL_REFERENCE_KEY is required}
    function-catalog-service-key: ${INTERNAL_FUNCTION_CATALOG_KEY:?INTERNAL_FUNCTION_CATALOG_KEY is required}

server:
  port: 8081

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    prefer-ip-address: true

azure:
  translator:
    endpoint: ${AZURE_TRANSLATOR_ENDPOINT:https://api.cognitive.microsofttranslator.com}
    key: ${AZURE_TRANSLATOR_KEY:}
    region: ${AZURE_TRANSLATOR_REGION:}

reference-service:
  base-url: ${REFERENCE_SERVICE_BASE_URL:http://localhost:8084}
  internal-key: ${INTERNAL_IDENTITY_KEY:?INTERNAL_IDENTITY_KEY is required}

function-catalog-service:
  internal-key: ${INTERNAL_IDENTITY_KEY:?INTERNAL_IDENTITY_KEY is required}
