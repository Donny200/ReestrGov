spring:
  application:
    name: identity-service

  config:
    import: optional:file:.env[.properties],optional:file:../.env[.properties]

  datasource:
    url: jdbc:postgresql://localhost:5433/adlita_project1
    username: postgres
    password: ${IDENTITY_DB_PASSWORD:${POSTGRES_PASSWORD}}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    baseline-on-migrate: true
    baseline-version: 0

springdoc:
  swagger-ui:
    path: /swagger

jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000
  refresh-expiration: 604800000

app:
  cookie:
    access-token-name: accessToken
    refresh-token-name: refreshToken
    refresh-token-path: /api/auth
  cors:
    allowed-origins:
      - http://localhost:3000
      - http://localhost:5173

server:
  port: 8081

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    prefer-ip-address: true
